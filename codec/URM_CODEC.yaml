  04: ["GRAPH", ["centrality_salience","branch_hold","loop_closure","graph_rebase"], ["CONVERSATION_GRAPH","BRANCH_HOLD","LOOP_CLOSURE","GRAPH_REBASE"], ["centrality_loss","rebase_fail","loop_break"], "S=centrality(N)|not recency(N)", []]
